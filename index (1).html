<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yara Amorim • Links</title>
<meta name="description" content="Links oficiais de Yara Amorim">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root{
    --rosa:#ff6fb5;
    --rosa-claro:#ffc9e1;
    --rosa-fundo:#ffe3f0;
    --salmao:#f4a99a;
    --laranja:#ff9a3c;
    --texto:#2a1a24;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Poppins',sans-serif;
    color:var(--texto);
    min-height:100vh;
    background:linear-gradient(160deg,#ffd6ea 0%,#ffe9f3 45%,#ffd0e4 100%);
    display:flex;justify-content:center;
    padding:32px 18px 48px;
    position:relative;overflow-x:hidden;
  }
  .sparkle{position:fixed;color:#fff;opacity:.9;pointer-events:none;font-size:26px}
  .s1{top:28px;left:22px}.s2{top:70px;right:26px;font-size:36px}.s3{bottom:80px;left:30px;font-size:30px}.s4{bottom:40px;right:40px}
  main{width:100%;max-width:440px;text-align:center;position:relative;z-index:1}

  .avatar{
    width:128px;height:128px;border-radius:50%;margin:0 auto 14px;
    background:linear-gradient(135deg,var(--rosa),var(--laranja));
    padding:4px;box-shadow:0 8px 24px rgba(255,111,181,.35);
  }
  .avatar img,.avatar .ph{
    width:100%;height:100%;border-radius:50%;object-fit:cover;background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Pacifico',cursive;font-size:44px;color:var(--rosa);
  }
  h1{font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
  .verificado{width:22px;height:22px}
  .user{font-size:15px;color:#7a4b63;margin-top:2px}
  .bio{font-size:14px;color:#7a4b63;margin:10px 0 24px}

  .btn{
    display:flex;align-items:center;gap:14px;
    width:100%;padding:12px 16px;margin-bottom:14px;
    border:2.5px solid var(--texto);border-radius:999px;
    background:rgba(255,255,255,.55);color:var(--texto);
    text-decoration:none;font-weight:600;font-size:16px;
    transition:transform .15s, background .15s, box-shadow .15s;
  }
  .btn:hover{transform:translateY(-2px);background:#fff;box-shadow:0 6px 16px rgba(255,111,181,.35)}
  .btn:active{transform:scale(.98)}
  .btn .ic{
    width:44px;height:44px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .btn .ic svg{width:24px;height:24px;fill:#fff}
  .tg .ic{background:#27a7e7}
  .ig .ic{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
  .btn span.t{flex:1;text-align:center;padding-right:44px}

  .titulo{
    font-family:'Pacifico',cursive;color:var(--rosa);font-size:24px;margin:26px 0 12px;
  }
  .previas{display:flex;flex-direction:column;gap:14px}
  .previa{
    position:relative;display:block;width:100%;border-radius:22px;overflow:hidden;
    border:2.5px solid var(--texto);text-decoration:none;
    background:linear-gradient(160deg,#c98a6b,#6b3f4f);
    box-shadow:0 8px 20px rgba(42,26,36,.25);
    transition:transform .15s;
  }
  .previa:hover{transform:scale(1.02)}
  .previa img{display:block;width:100%;height:100%;object-fit:cover}
  .previa .cadeado{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:72px;height:72px;border-radius:50%;
    background:rgba(255,255,255,.92);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.3);
  }
  .previa .cadeado svg{width:34px;height:34px;fill:var(--rosa)}
  .previa .leg{
    position:absolute;left:0;right:0;bottom:0;padding:8px;
    font-size:12px;font-weight:600;color:#fff;
    background:linear-gradient(transparent,rgba(0,0,0,.55));
  }
  .rodape{margin-top:30px;font-size:12px;color:#9a6b83}
</style>
</head>
